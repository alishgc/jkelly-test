<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} — {{ site.title }}</title>
  <link rel="stylesheet" href="{{ site.baseurl }}/style.css">
  <!-- 👆 reuses your existing site.css, so posts match your site's look -->
</head>
<body>

  <!-- ====== PASTE YOUR SITE'S HEADER/NAV HERE ====== -->
  <header>
    <nav>
      <a href="{{ site.baseurl }}/">Home</a>
      <a href="{{ site.baseurl }}/blog/">Blog</a>
    </nav>
  </header>
  <!-- ================================================ -->

  <main class="post">
    <article>
      <h1>{{ page.title }}</h1>
      <p class="post-date">{{ page.date | date: "%B %-d, %Y" }}</p>

      <div class="post-content">
        {{ content }}
      </div>
    </article>
  </main>

  <!-- ====== PASTE YOUR SITE'S FOOTER HERE ====== -->
  <footer>
    <p>&copy; {{ 'now' | date: "%Y" }} Alish</p>
  </footer>
  <!-- ============================================ -->

</body>
</html>
