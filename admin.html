<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { background: #0f111a; color: #f0ede6; font-family: 'Space Grotesk', sans-serif; padding: 40px; display: flex; justify-content: center; }
    .dash { width: 100%; max-width: 600px; background: #181a24; padding: 32px; border-radius: 12px; border: 1px solid #262938; }
    h1 { margin-top: 0; color: #f5a73b; }
    .btn { display: block; width: 100%; background: #262938; color: #fff; padding: 16px; text-decoration: none; border-radius: 8px; margin-bottom: 16px; text-align: center; transition: 0.2s; }
    .btn:hover { background: #f5a73b; color: #000; }
  </style>
</head>
<body>
  <div class="dash">
    <h1>Alish's Dashboard</h1>
    <p>Because this site is statically generated via GitHub Actions/Pages, write your posts via the GitHub UI to auto-deploy.</p>
    
    <a href="https://github.com/alishgc/portfolio/new/main/_posts?filename=YYYY-MM-DD-new-post.md&value=---%0Alayout%3A%20post%0Atitle%3A%20%22%22%0Adate%3A%202026-10-01%0Atags%3A%20%5Btag1%5D%0Athumbnail%3A%20%22%2Fassets%2Fthumbnail-placeholder.jpg%22%0A---%0A%0AWrite%20content%20here..." class="btn" target="_blank">✍️ Create New Blog Post</a>
    
    <a href="https://analytics.google.com/" class="btn" target="_blank">📊 View Page Visits (Google Analytics)</a>
    
    <a href="https://github.com/alishgc/portfolio/edit/main/index.html" class="btn" target="_blank">⚙️ Edit Homepage</a>
  </div>
</body>
</html>
