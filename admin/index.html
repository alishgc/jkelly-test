<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — alish.gc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f111a; --surface: #181a24; --border: #262938;
      --ink: #f0ede6; --ink-dim: #a0a6b8; --accent: #f5a73b;
      --font-display: 'Space Grotesk', sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #faf9f7; --surface: #ffffff; --border: #e6e3dc;
        --ink: #1a1c24; --ink-dim: #6b7080; --accent: #c47a10;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: var(--font-mono); min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    .admin { display: flex; min-height: 100vh; }

    /* Sidebar */
    .sidebar {
      width: 220px; padding: 24px 18px;
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 28px;
      position: sticky; top: 0; height: 100vh;
    }
    .sidebar .logo { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; }
    .sidebar .logo .dot { color: var(--accent); }
    .sidebar nav { display: flex; flex-direction: column; gap: 4px; }
    .sidebar nav a {
      font-size: 0.82rem; color: var(--ink-dim);
      padding: 8px 10px; border-radius: 8px; transition: all 0.2s;
    }
    .sidebar nav a:hover, .sidebar nav a.is-active {
      background: var(--surface); color: var(--accent);
    }
    .sidebar__foot { margin-top: auto; font-size: 0.68rem; color: var(--ink-dim); }

    /* Main */
    .main { flex: 1; padding: 28px 32px; max-width: 1100px; }
    .main__head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 28px; flex-wrap: wrap; gap: 12px;
    }
    .main__head h1 { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; }
    .btn {
      font-family: var(--font-mono); font-size: 0.75rem;
      padding: 8px 16px; border-radius: 8px; border: 1px solid var(--accent);
      background: transparent; color: var(--accent); cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { background: var(--accent); color: #12141c; }

    /* Stats */
    .stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px; margin-bottom: 28px;
    }
    .stat {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 18px;
    }
    .stat__label { font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 8px; }
    .stat__value { font-family: var(--font-display); font-size: 1.8rem; font-weight: 700; }
    .stat__value span { font-size: 0.9rem; color: var(--ink-dim); font-weight: 400; }

    /* Tag chart */
    .chart {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px; margin-bottom: 28px;
    }
    .chart h2 { font-family: var(--font-display); font-size: 1rem; font-weight: 600; margin-bottom: 16px; }
    .bar-row { display: flex; align-items: center; gap
